<nav class="navbar navbar-expand-md bg-dark-green" data-bs-theme="off-white">
  <div class="container">
    <a class="navbar-brand" href="/">
      <img src="/assets/images/favicon/favicon.svg" alt="Website Logo" height="50">
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a href="/" {% if page.url == "/" %} class="nav-link active" aria-current="page" {% else %} class="nav-link" {% endif %}>Home</a>
        </li>
        {% for item in site.data.navigation %} 
          <li class="nav-item">
            <a href="{{ item.link }}" {% if page.url contains item.link %} class="nav-link active" aria-current="page" {% else %} class="nav-link" {% endif %}>{{ item.name }}</a>
          </li>
        {% endfor %} 
      </ul>
      
    </div>
  </div>
  
</nav>
