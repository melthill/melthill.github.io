---
layout: default
title: Home
---
<div class="image-header my-auto">
    <div class="transparent-header">
       <div class="index-container">
            <div class="row gx-5 gy-4 justify-content-center">
                <div class="col-12 col-lg-4 d-flex justify-content-center justify-content-lg-end align-items-center">
                    <div class="">
                        <img src="/assets/images/portrait_with_persona.jpg" alt="Personal Portrait" class="portrait-image">
                    </div>
                </div>

                <div class="col-12 col-lg-8 col-xl-6 d-flex flex-column justify-content-center">
                    <div class="fs-1 shadow-text mb-4">
                        Hi! My name is 
                        <span class="fw-bolder">Mel Thill </span>
                        and I am a Software Developer and Digital Artist.
                    </div>

                    <div class="d-md-flex">
                        {% for item in site.data.navigation %} 
                            <a href="{{ item.link }}" class="link-button shadow-text">
                                <p class="no-mb me-2">{{ item.text }}</p>
                                <span class="material-symbols-outlined">chevron_right</span>
                            </a>
                        {% endfor %} 
                    </div>
                </div>
            </div>
       </div>
    </div>
</div>
