---
layout: main
title: Software Projects
permalink: /portfolio/projects
---

<div class="row g-4">
  {% for p in site.projects %}
    <div class="col-12">
      <div class="custom-card d-flex shadow">
        <div class="custom-card-v-title d-flex flex-column">
          <h1 class="no-mb">{{ p.title }}</h1>
          <h5 class="fw-light">{{ p.type }}</h5>
          <hr class="no-mb">
          <p>{{ p.content | markdownify }}</p>
          
          <div class="d-flex justify-content-between align-items-end mt-auto">
            <p class="no-mb fw-light">{{ p.formatted-dates }}</p>
            <span class="material-symbols-outlined icon-lg custom-card-arrow">chevron_right</span>
          </div>
        </div>

        <div class="position-relative">
          {%  assign source = "/assets/images/portfolio/art/preview.png" %}
          <img src="{{ source }}" class="custom-card-v-img">

          <div class="custom-card-v-color"></div>
        </div>

        <a href="{{ p.url }}" class="stretched-link"></a>
      </div>
    </div>
  {% endfor %}
</div>
